<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For the Amazing Sravya! 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ffb6c1, #ff69b4);
            font-family: 'Comic Neue', cursive;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 20px;
            position: relative;
        }

        h1 {
            color: #e75480;
            font-size: 2.5em;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        .message {
            font-size: 1.2em;
            color: #333;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            animation: float 6s infinite;
            opacity: 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .cute-element {
            width: 100px;
            height: 100px;
            background: #ff69b4;
            border-radius: 50%;
            position: absolute;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .bear-emoji {
            font-size: 4em;
            margin: 20px;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container">
        <div class="cute-element" style="top: -50px; left: -50px;"></div>
        <div class="cute-element" style="bottom: -50px; right: -50px;"></div>
        
        <h1>To the Wonderful Sravya! 🌸</h1>
        
        <div class="bear-emoji">🐻‍❄️</div>
        
        <div class="message">
            <p>You're more amazing than a rainbow after rain! 🌈</p>
            <p>Your kindness sparkles brighter than stars! ✨</p>
            <p>Your smile could light up the darkest day! ☀️</p>
            <p>Never forget how truly special you are! 💖</p>
        </div>

        <div style="font-size: 3em; margin-top: 20px;">
            🌸🎀💐🐇🍭
        </div>
    </div>

    <script>
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const emojis = ['💖', '🌸', '🎀', '💐', '🍭', '✨'];
            
            for(let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heartsContainer.appendChild(heart);
            }
        }

        createHearts();
    </script>
</body>
</html>
